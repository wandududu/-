<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

            background-color: #121212;
            color: #e0e0e0;

            font-size: 11px;
            border-radius: 6px;
            cursor: pointer;
        }
